name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, admin, portal]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: matrix.app == 'api'
        name: Check project language
        run: |
          status=0
          git grep -I -l -P '\p{Arabic}' || status=$?
          if [ "$status" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::Translate the listed files before merging into main."
            exit 0
          fi
          if [ "$status" -ne 1 ]; then exit 1; fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
      - if: matrix.app == 'api'
        run: npm test -- --runInBand
        working-directory: apps/api
      - if: matrix.app == 'api'
        run: |
          node apps/api/scripts/setup-local.cjs
          docker compose --env-file apps/api/.env up -d --wait
          npm --prefix apps/api run test:e2e -- --runInBand
